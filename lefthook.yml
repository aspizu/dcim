pre-commit:
  parallel: true
  jobs:
    - name: typecheck-cli
      glob: "cli/**/*.{py}"
      run: cd cli && ty check

    - name: lint-cli
      glob: "cli/**/*.{py}"
      run: cd cli && ruff check

    - name: typecheck-client
      glob: "{packages/client/**/*.{ts,tsx},packages/common/**/*.ts}"
      run: cd packages/client && node_modules/.bin/tsc -p tsconfig.app.json

    - name: typecheck-server
      glob: "{packages/server/**/*.ts,packages/server/tsconfig.json,packages/common/**/*.ts}"
      run: cd packages/server && node_modules/.bin/tsc -p tsconfig.json

    - name: typecheck-common
      glob: "{packages/common/**/*.ts,packages/common/tsconfig.json}"
      run: cd packages/common && node_modules/.bin/tsc -p tsconfig.json

    - name: typecheck-scripts
      glob: "{scripts/**/*.ts,scripts/tsconfig.json,packages/server/tsconfig.json}"
      run: packages/server/node_modules/.bin/tsc -p scripts/tsconfig.json

    - name: lint-client
      glob: "packages/client/**/*.{ts,tsx}"
      run: cd packages/client && node_modules/.bin/oxlint

    - name: lint-server
      glob: "packages/server/**/*.{ts}"
      run: cd packages/server && node_modules/.bin/oxlint

    - name: wrangler-types
      glob: "wrangler.jsonc"
      run: node_modules/.bin/wrangler types --check

    - name: format
      glob: "**/*.{ts,tsx,json,jsonc,yml,yaml,md,toml,css}"
      run: node_modules/.bin/oxfmt --check {staged_files}

    - name: format-python
      glob: "**/*.{py}"
      run: ruff format --check {staged_files}
