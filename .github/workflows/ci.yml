name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR checks can stop; a production deployment must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: "0"

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Check code formatting
        run: pnpm exec oxfmt --check

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up project
        id: setup
        uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm --filter @dcim/client run lint --format github

      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter @dcim/client run check

      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter @dcim/client exec vite build

      - name: Upload build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: packages/client/dist
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up project
        id: setup
        uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm --filter @dcim/server run lint --format github

      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter @dcim/server run check

      - name: Validate Wrangler types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec wrangler types --check

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruff
        id: setup
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.16.6"
          args: "--version"

      - name: Lint
        run: ruff check --output-format github

      - name: Check code formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ruff format --check --diff

  deploy:
    name: Deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [formatting, client, server, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: packages/client/dist

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
